name: Weekly AI Value Chain Report

on:
  schedule:
    # Every Monday at 13:00 UTC (adjust to taste)
    - cron: '0 13 * * 1'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate this week's edition
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_report.py

      - name: Commit updated report data
        run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          git add report_data.json history/
          git diff --cached --quiet || git commit -m "Weekly edition: $(date +'%Y-%m-%d')"
          git push
